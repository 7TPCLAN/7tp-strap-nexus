name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "assets/**"
      - "requirements.txt"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download LGPL FFmpeg build
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter "ffmpeg.exe" -File -Recurse | Where-Object { $_.FullName -match '[\\/]bin[\\/]ffmpeg\.exe$' } | Select-Object -First 1
          if (-not $ffmpeg) { throw "Could not find ffmpeg.exe in the downloaded FFmpeg archive." }
          $bin = $ffmpeg.Directory.FullName
          New-Item -ItemType Directory -Force -Path "vendor/ffmpeg" | Out-Null
          Copy-Item (Join-Path $bin "*") "vendor/ffmpeg/" -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.LGPLv2.1" -OutFile "vendor/ffmpeg/COPYING.LGPLv2.1"
          @"
          FFmpeg binary build: BtbN FFmpeg Builds (win64 LGPL)
          Download: https://github.com/BtbN/FFmpeg-Builds/releases
          FFmpeg project: https://ffmpeg.org/
          License: GNU Lesser General Public License (LGPL), version 2.1 or later.
          This build uses FFmpeg's native MPEG-4 video encoder and does not require libx264.
          The release bundles the FFmpeg executable and its accompanying DLL files from the same build.
          "@ | Set-Content -Encoding utf8 "vendor/ffmpeg/FFMPEG-BUILD-NOTICE.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Generate Windows icon
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PySide6.QtCore import Qt
          from PySide6.QtGui import QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer
          from PIL import Image
          png = Path('assets/nexus-icon.png')
          image = QImage(256, 256, QImage.Format.Format_ARGB32)
          image.fill(Qt.GlobalColor.transparent)
          painter = QPainter(image)
          renderer = QSvgRenderer('assets/nexus-icon.svg')
          if not renderer.isValid(): raise SystemExit('Invalid SVG icon')
          renderer.render(painter)
          painter.end()
          image.save(str(png), 'PNG')
          with Image.open(png) as rendered:
              rendered.save('assets/nexus-icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/generate_nexus_icon.py"
          python "$env:RUNNER_TEMP/generate_nexus_icon.py"
      - name: Build app with bundled FFmpeg and branding
        shell: pwsh
        run: |
          $pyiArgs = @(
            "--noconfirm", "--clean", "--windowed",
            "--name", "7TP Nexus Strap",
            "--icon", "assets/nexus-icon.ico",
            "--add-data", "assets/nexus-logo.svg;assets",
            "--add-data", "assets/nexus-icon.svg;assets",
            "--add-binary", "vendor/ffmpeg/ffmpeg.exe;ffmpeg",
            "src/main.py"
          )
          Get-ChildItem "vendor/ffmpeg" -Filter "*.dll" -File | ForEach-Object {
            $pyiArgs += @("--add-binary", "$($_.FullName);ffmpeg")
          }
          pyinstaller @pyiArgs
      - name: Include third-party notices
        shell: pwsh
        run: |
          $repoRoot = $env:GITHUB_WORKSPACE
          $appDir = Join-Path $repoRoot "dist/7TP Nexus Strap"
          $notice = Join-Path $repoRoot "THIRD_PARTY_NOTICES.md"
          $license = Join-Path $repoRoot "vendor/ffmpeg/COPYING.LGPLv2.1"
          $ffmpegNotice = Join-Path $repoRoot "vendor/ffmpeg/FFMPEG-BUILD-NOTICE.txt"
          if (-not (Test-Path (Join-Path $appDir "7TP Nexus Strap.exe"))) { throw "Packaged app executable missing: $appDir" }
          foreach ($required in @($notice, $license, $ffmpegNotice)) {
            if (-not (Test-Path $required)) { throw "Required licensing file missing: $required" }
          }
          Copy-Item $notice (Join-Path $appDir "THIRD_PARTY_NOTICES.md") -Force
          Copy-Item $license (Join-Path $appDir "COPYING.LGPLv2.1") -Force
          Copy-Item $ffmpegNotice (Join-Path $appDir "FFMPEG-BUILD-NOTICE.txt") -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build single setup EXE
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:NEXUS_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $env:NEXUS_VERSION = "0.1.0-dev"
          }
          $repoRoot = $env:GITHUB_WORKSPACE
          $scriptPath = Join-Path $repoRoot "installer/NexusStrap.iss"
          $appDir = Join-Path $repoRoot "dist/7TP Nexus Strap"
          $outputDir = Join-Path $repoRoot "dist-installer"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $scriptPath)) { throw "Installer script not found: $scriptPath" }
          if (-not (Test-Path (Join-Path $appDir "7TP Nexus Strap.exe"))) { throw "Packaged app executable not found in: $appDir" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at: $iscc" }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Write-Host "Installer script: $scriptPath"
          Write-Host "App directory: $appDir"
          Write-Host "Output directory: $outputDir"
          & $iscc "/DNexusVersion=$env:NEXUS_VERSION" $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload setup EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7TP-Nexus-Strap-Setup
          path: dist-installer/7TP-Nexus-Strap-Setup.exe
          if-no-files-found: error
      - name: Publish GitHub Release with setup EXE only
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 7TP Nexus Strap ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-installer/7TP-Nexus-Strap-Setup.exe
          fail_on_unmatched_files: true
